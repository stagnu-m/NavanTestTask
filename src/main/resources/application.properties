spring.application.name=navan-travel-invoice-service

# SQLite Configuration
spring.datasource.url=jdbc:sqlite:data/travel_invoice.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# Actuator health (served at /health, includes db + diskSpace checks, 503 when DOWN)
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health
management.endpoint.health.show-components=always

# JSON formatting
spring.jackson.default-property-inclusion=non_null
spring.jackson.generator.write-bigdecimal-as-plain=true
